name: Sync Configs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'  # Chaque lundi 9h UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          mkdir -p local-configs/backup
          echo "TIMESTAMP=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV

      - name: Sync configs
        run: |
          set -e
          
          echo "🔄 Synchronisation des configs..."
          
          FOLDERS=(
            ".agents"
            ".claude-plugin"
            ".clinerules"
            ".codex-plugin"
            ".cursor"
            ".devin-plugin"
            ".github"
            ".kiro"
            ".openclaw"
            ".opencode"
            ".windsurf"
          )
          
          for folder in "${FOLDERS[@]}"; do
            if [ -d "$folder" ]; then
              echo "  ✓ $folder"
              mkdir -p "local-configs/$folder"
              cp -r "$folder"/* "local-configs/$folder/" 2>/dev/null || true
            fi
          done
          
          echo "✅ Sync complétée"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add local-configs/
            git commit -m "ci: sync configs - ${{ env.TIMESTAMP }}"
            git push
            echo "📤 Push complété"
          else
            echo "ℹ️  Pas de changements"
          fi
